<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>

<body>

    <header>
        <p>№</p>
        <span></span>
        <p>Cantitatea</p>
        <span></span>
        <p>Preț</p>
    </header>
    <main>
        <span class="bar"></span>
        <div id="produse">
        </div>
        <span class="bar"></span>
        <h2>Poziții</h2>
        <span class="bar"></span>
        <div class="pozitii">
            <input id="price" type="number" placeholder="0.00 MDL">
            <button id="add" class="add">
                <p>+</p>
            </button>
        </div>
        <span class="bar"></span>
        <div class="contetnt-title">
            <p class="title">Cât spre achitare</p>
            <span></span>
            <p class="title sum">Cât a achitat</p>
            <span></span>
            <p class="title">Rest</p>
        </div>
        <span class="bar"></span>
        <div id="price-client">
        </div>
        <span class="bar"></span>
        <div class="operatii">
            <button id="finish" class="end">
                <p>Finisat</p>
            </button>
        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
